<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EchoFrame Thought Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; background: #0d1117; color: #fff; }
    h1 { padding: 1rem; margin: 0; background: #161b22; color: #58a6ff; }
    #graph { width: 100%; height: 92vh; }
    circle { fill: #58a6ff; cursor: pointer; }
    text { font-size: 12px; fill: #c9d1d9; pointer-events: none; }
    .link { stroke: #30363d; stroke-width: 2px; }
  </style>
</head>
<body>
  <h1>🧠 EchoFrame: Thought Graph</h1>
  <div id="graph"></div>

  <script>
    const api = "http://localhost:8000";
    let nodes = [];
    let links = [];
    let nodeMap = new Map();

    async function expandNode(nodeId) {
      try {
        const res = await fetch(`${api}/expand`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ node_id: nodeId })
        });
        const data = await res.json();
        await fetchGraph();
      } catch (err) {
        console.error("Expansion failed:", err);
      }
    }

    async function fetchGraph() {
      try {
        const res = await fetch(`${api}/graph`);
        const json = await res.json();
        nodes = json.nodes;
        links = nodes.flatMap(n => n.parent ? [{ source: n.parent, target: n.id }] : []);
        nodeMap = new Map(nodes.map(n => [n.id, n]));
        render();
      } catch (err) {
        console.error("Failed to load graph:", err);
      }
    }

    function render() {
      document.getElementById("graph").innerHTML = "";
      const svg = d3.select("#graph")
        .append("svg")
        .attr("width", window.innerWidth)
        .attr("height", window.innerHeight * 0.92);

      const sim = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(100))
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2));

      const link = svg.selectAll(".link")
        .data(links)
        .enter()
        .append("line")
        .attr("class", "link");

      const node = svg.selectAll("circle")
        .data(nodes)
        .enter()
        .append("circle")
        .attr("r", 18)
        .on("click", (event, d) => expandNode(d.id));

      const label = svg.selectAll("text")
        .data(nodes)
        .enter()
        .append("text")
        .text(d => d.content.slice(0, 35));

      sim.on("tick", () => {
        link.attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node.attr("cx", d => d.x)
            .attr("cy", d => d.y);

        label.attr("x", d => d.x + 22)
             .attr("y", d => d.y + 4);
      });
    }

    // ✅ Just fetch existing graph — don't auto-init again
    fetchGraph();
  </script>
</body>
</html>
